[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lutsia-max"
version = "0.1.2"
description = "MAX: Alexa, Codex con ChatGPT y herramientas domésticas verificadas"
requires-python = ">=3.12"
license = "MIT"
license-files = ["max_runtime/LICENSE"]
dependencies = [
  "fastapi==0.162.4", "uvicorn==0.54.0", "httpx==0.28.1",
  "pydantic==2.14.3", "trafilatura==2.3.1",
  "ask-sdk-core==1.19.0", "ask-sdk-webservice-support==1.3.3",
  "oscrypto @ git+https://github.com/wbond/oscrypto.git@76bfdcb7285d856c44f8d0fbafe0ecca1c6d2f8b",
  "zeroconf==0.154.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1"]

[project.scripts]
max-cli = "max_runtime.cli:main"

[tool.setuptools.packages.find]
include = ["max_runtime*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
